name: Ansible CI

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "ansible/**"
      - ".github/workflows/ansible-ci.yml"

permissions:
  contents: read

concurrency:
  group: ansible-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Ansible
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ansible/requirements.txt

      - name: Install pinned tooling
        run: python -m pip install --no-input -r ansible/requirements.txt

      - name: Check for committed private keys
        run: ansible/scripts/validate.sh secrets

      - name: Validate and install pinned collections
        run: ansible/scripts/validate.sh collections

      - name: YAML lint
        run: ansible/scripts/validate.sh yaml

      - name: Ansible lint
        run: ansible/scripts/validate.sh lint

      - name: Inventory and playbook syntax check
        run: ansible/scripts/validate.sh syntax
