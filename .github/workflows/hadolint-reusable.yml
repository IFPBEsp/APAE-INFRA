
name: Reusable Dockerfile Lint

on:
  workflow_call:
    inputs:
      dockerfiles:
        description: "Caminhos dos Dockerfiles, um por linha"
        required: true
        type: string

      failure-threshold:
        description: "Severidade minima que bloqueia o check"
        required: false
        type: string
        default: "warning"

      config-file:
        description: "Configuracao alternativa no repositorio caller; vazio usa APAE-INFRA"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare Dockerfiles
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      dockerfiles: ${{ steps.prepare.outputs.dockerfiles }}

    steps:
      - name: Checkout application repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate inputs and Dockerfile paths
        id: prepare
        shell: bash
        env:
          DOCKERFILES: ${{ inputs.dockerfiles }}
          FAILURE_THRESHOLD: ${{ inputs.failure-threshold }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          valid_thresholds = {
              "error", "warning", "info",
              "style", "ignore", "none"
          }

          threshold = os.environ["FAILURE_THRESHOLD"]
          if threshold not in valid_thresholds:
              raise SystemExit(
                  f"::error::failure-threshold invalido: {threshold}"
              )

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          dockerfiles = []
          seen = set()

          for raw in os.environ["DOCKERFILES"].splitlines():
              name = raw.strip()

              if not name:
                  continue

              relative = Path(name)

              if relative.is_absolute() or ".." in relative.parts:
                  raise SystemExit(
                      f"::error::Caminho nao permitido: {name}"
                  )

              target = (workspace / relative).resolve()

              if not target.is_relative_to(workspace):
                  raise SystemExit(
                      f"::error::Arquivo fora do workspace: {name}"
                  )

              if not target.is_file():
                  raise SystemExit(
                      f"::error::Dockerfile nao encontrado: {name}"
                  )

              normalized = target.relative_to(workspace).as_posix()

              if normalized not in seen:
                  seen.add(normalized)
                  dockerfiles.append(normalized)

          if not dockerfiles:
              raise SystemExit(
                  "::error::Nenhum Dockerfile foi informado."
              )

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(
                  "dockerfiles="
                  + json.dumps(dockerfiles, separators=(",", ":"))
                  + "\n"
              )

          print(f"Dockerfiles para analise: {len(dockerfiles)}")
          for item in dockerfiles:
              print(f" - {item}")
          PY

  lint:
    name: Hadolint (${{ matrix.dockerfile }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        dockerfile: ${{ fromJSON(needs.prepare.outputs.dockerfiles) }}

    steps:
      - name: Checkout application repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkout shared configuration
        if: inputs.config-file == ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .infra-hadolint
          persist-credentials: false

      - name: Resolve Hadolint configuration
        id: config
        shell: bash
        env:
          CUSTOM_CONFIG: ${{ inputs.config-file }}
        run: |
          set -euo pipefail

          if [[ -n "$CUSTOM_CONFIG" ]]; then
            config="$CUSTOM_CONFIG"
          else
            config=".infra-hadolint/.hadolint.yaml"
          fi

          if [[ "$config" = /* || "$config" == *".."* ]]; then
            echo "::error::Caminho de configuracao invalido."
            exit 1
          fi

          if [[ ! -f "$config" ]]; then
            echo "::error::Configuracao nao encontrada: $config"
            exit 1
          fi

          echo "path=$config" >> "$GITHUB_OUTPUT"

      - name: Check non-root user
        shell: bash
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          import sys

          path = os.environ["DOCKERFILE"]
          text = re.sub(r"\\\r?\n", " ", open(path, encoding="utf-8").read())

          stage_users = {}
          user = None
          stage = None

          for line in text.splitlines():
              parts = line.split()

              if not parts or parts[0].startswith("#"):
                  continue

              keyword = parts[0].upper()

              if keyword == "FROM":
                  if stage:
                      stage_users[stage] = user

                  args = [part for part in parts[1:] if not part.startswith("--")]
                  base = args[0].lower() if args else ""
                  user = stage_users.get(base)
                  stage = (
                      args[2].lower()
                      if len(args) >= 3 and args[1].upper() == "AS"
                      else None
                  )
              elif keyword == "USER" and len(parts) > 1:
                  user = parts[1]

          if user is None or re.match(r"^(root|0)(:|$)", user):
              print(
                  f"::error file={path}::O estágio final não define um USER não-root."
              )
              sys.exit(1)

          print(f"USER do estágio final: {user}")
          PY

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          config: ${{ steps.config.outputs.path }}
          failure-threshold: ${{ inputs.failure-threshold }}
          no-color: true
