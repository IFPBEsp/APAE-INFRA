name: Reusable Update Image Overlay

on:
  workflow_call:
    inputs:
      image:
        description: "Imagem completa no GHCR"
        required: false
        type: string

      image-tag:
        description: "Tag sha-<short-sha>"
        required: false
        type: string

      image-digest:
        description: "Digest OCI da imagem publicada"
        required: false
        type: string

      release-json:
        description: "JSON da versao candidata com frontend e backend (mutuamente exclusivo com image*)"
        required: false
        type: string

      application:
        description: "Aplicação que será atualizada"
        required: true
        type: string

      environment:
        description: "Ambiente de destino"
        required: false
        default: dev
        type: string

      source-repository:
        description: "Repositório que publicou a imagem"
        required: true
        type: string

      source-commit:
        description: "Commit que originou a imagem"
        required: true
        type: string

    outputs:
      pull-request-url:
        description: "URL do PR criado ou atualizado; vazio quando não há diferença"
        value: ${{ jobs.update-image.outputs.pull-request-url || jobs.update-release.outputs.pull-request-url }}

    secrets:
      IMAGE_UPDATER_APP_ID:
        description: "Fornecido pelo environment gitops-image-updater; não repassar pelo caller"
        required: false

      IMAGE_UPDATER_APP_PRIVATE_KEY:
        description: "Fornecido pelo environment gitops-image-updater; não repassar pelo caller"
        required: false

      GHCR_READ_USERNAME:
        description: "Usuário do PAT opcional para leitura de imagens privadas"
        required: false

      GHCR_READ_TOKEN:
        description: "PAT opcional com read:packages; sem ele usa o GITHUB_TOKEN"
        required: false

jobs:
  update-image:
    name: Update Kubernetes image
    if: inputs.release-json == ''
    runs-on: ubuntu-24.04
    environment: gitops-image-updater

    permissions:
      contents: read
      packages: read

    timeout-minutes: 15
    concurrency:
      group: gitops-${{ inputs.application }}-${{ inputs.environment }}
      cancel-in-progress: false

    outputs:
      pull-request-url: ${{ steps.pull-request.outputs.pull-request-url }}

    steps:
      - name: Validate workflow inputs
        shell: bash
        env:
          IMAGE: ${{ inputs.image }}
          IMAGE_TAG: ${{ inputs.image-tag }}
          IMAGE_DIGEST: ${{ inputs.image-digest }}
          ENVIRONMENT: ${{ inputs.environment }}
          APPLICATION: ${{ inputs.application }}
          SOURCE_COMMIT: ${{ inputs.source-commit }}
          SOURCE_REPOSITORY: ${{ inputs.source-repository }}
          CALLER_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ -z "$IMAGE" || -z "$IMAGE_TAG" || -z "$IMAGE_DIGEST" ]]; then
            echo "::error::Imagem, tag e digest sao obrigatorios no modo individual."
            exit 1
          fi

          if [[ "$ENVIRONMENT" != "dev" ]]; then
            echo "::error::Somente o ambiente dev é permitido."
            exit 1
          fi

          if [[ ! "$APPLICATION" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::Identificador de aplicação inválido."
            exit 1
          fi

          if [[ ! "$IMAGE_TAG" =~ ^sha-[a-f0-9]{7,40}$ ]]; then
            echo "::error::Tag de imagem inválida."
            exit 1
          fi

          if [[ ! "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::SHA do commit de origem inválido."
            exit 1
          fi

          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Digest OCI inválido."
            exit 1
          fi

          if [[ ! "$IMAGE" =~ ^ghcr\.io/ifpbesp/[a-z0-9._/-]+$ ]]; then
            echo "::error::Imagem fora do GHCR autorizado."
            exit 1
          fi

          if [[ "$CALLER_REPOSITORY" != "IFPBEsp/APAE-INFRA" ]]; then
            echo "::error::Este workflow deve ser executado exclusivamente no APAE-INFRA."
            exit 1
          fi

          case "$SOURCE_REPOSITORY:$APPLICATION:$IMAGE" in
            IFPBEsp/apae-site-comemorativo:site-comemorativo:ghcr.io/ifpbesp/apae-site-comemorativo)
              ;;
            *)
              echo "::error::Fluxo individual reservado ao Site Comemorativo."
              exit 1
              ;;
          esac

          if [[ "${IMAGE_TAG#sha-}" != "${SOURCE_COMMIT:0:${#IMAGE_TAG}-4}" ]]; then
            echo "::error::Tag não corresponde ao commit de origem."
            exit 1
          fi

          echo "Inputs validados."

      - name: Checkout automation revision
        id: automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: IFPBEsp/APAE-INFRA
          ref: ${{ github.sha }}
          token: ${{ github.token }}
          persist-credentials: false

      - name: Verify published image in GHCR
        id: registry
        shell: bash
        env:
          IMAGE: ${{ inputs.image }}
          IMAGE_TAG: ${{ inputs.image-tag }}
          IMAGE_DIGEST: ${{ inputs.image-digest }}
          GHCR_READ_USERNAME: ${{ secrets.GHCR_READ_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/ci/verify_ghcr_image.py

      - name: Authenticate to GHCR for provenance verification
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_READ_USERNAME != '' && secrets.GHCR_READ_TOKEN != '' && secrets.GHCR_READ_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_READ_USERNAME != '' && secrets.GHCR_READ_TOKEN != '' && secrets.GHCR_READ_TOKEN || github.token }}

      - name: Verify image build provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ inputs.image }}
          IMAGE_DIGEST: ${{ inputs.image-digest }}
          SOURCE_REPOSITORY: ${{ inputs.source-repository }}
          SOURCE_COMMIT: ${{ inputs.source-commit }}
        run: |
          set -euo pipefail

          SOURCE_REF="refs/heads/main"
          SIGNER_WORKFLOW="IFPBEsp/APAE-INFRA/.github/workflows/docker-build-publish-image.yml"

          echo "Verificando proveniência da imagem..."

          gh attestation verify \
            "oci://${IMAGE}@${IMAGE_DIGEST}" \
            --bundle-from-oci \
            --repo "$SOURCE_REPOSITORY" \
            --signer-workflow "$SIGNER_WORKFLOW" \
            --source-ref "$SOURCE_REF" \
            --source-digest "$SOURCE_COMMIT"

          echo "Proveniência autenticada com sucesso."

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.IMAGE_UPDATER_APP_ID }}
          private-key: ${{ secrets.IMAGE_UPDATER_APP_PRIVATE_KEY }}
          owner: IFPBEsp
          repositories: APAE-INFRA
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout dev manifests
        id: manifests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: IFPBEsp/APAE-INFRA
          ref: dev
          path: infra
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Resolve Kubernetes overlay
        id: overlay
        shell: bash
        working-directory: infra
        env:
          APPLICATION: ${{ inputs.application }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          if [[ "$ENVIRONMENT" != "dev" ]]; then
            echo "::error::Somente dev é permitido."
            exit 1
          fi

          case "$APPLICATION" in
            apae-geral)
              overlay="kubernetes/apae-geral/overlays/dev"
              ;;
            apae-atendimento)
              overlay="kubernetes/apae-atendimento/overlays/dev"
              ;;
            apae-gestao-escolar)
              echo "::error::Overlay de Gestão Escolar ainda não definido; depende das issues #38 e #92."
              exit 1
              ;;
            site-comemorativo)
              overlay="kubernetes/site-comemorativo/overlays/dev"
              ;;
            *)
              echo "::error::Aplicação não autorizada."
              exit 1
              ;;
          esac

          if [[ ! -f "$overlay/kustomization.yaml" ]]; then
            echo "::error::Overlay não encontrado: $overlay"
            echo "::error::A estrutura depende da issue #92."
            exit 1
          fi

          echo "path=$overlay" >> "$GITHUB_OUTPUT"

          echo "Overlay autorizado: $overlay"

      - name: Set up approved Kustomize
        uses: ./.github/actions/setup-kustomize

      - name: Install YAML editor
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/gitops-yaml"
          "$RUNNER_TEMP/gitops-yaml/bin/pip" install --disable-pip-version-check 'PyYAML==6.0.3'

      - name: Update and validate image reference
        id: image-update
        shell: bash
        working-directory: infra
        env:
          OVERLAY: ${{ steps.overlay.outputs.path }}
          IMAGE: ${{ inputs.image }}
          IMAGE_DIGEST: ${{ inputs.image-digest }}
          APPLICATION: ${{ inputs.application }}
          ENVIRONMENT: ${{ inputs.environment }}
          SOURCE_COMMIT: ${{ inputs.source-commit }}
          IMAGE_TAG: ${{ inputs.image-tag }}
          VERIFICATION_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitops-yaml/bin/python" - <<'PYTHON'
          import json
          import os
          import subprocess
          from pathlib import Path

          import yaml

          overlay = os.environ["OVERLAY"]
          image = os.environ["IMAGE"]
          digest = os.environ["IMAGE_DIGEST"]
          path = Path(overlay) / "kustomization.yaml"

          def container_images():
              rendered = subprocess.check_output(["kustomize", "build", overlay], text=True)
              result = []

              def visit(value):
                  if isinstance(value, dict):
                      for key, item in value.items():
                          if key in ("containers", "initContainers", "ephemeralContainers"):
                              result.extend(container["image"] for container in item)
                          else:
                              visit(item)
                  elif isinstance(value, list):
                      for item in value:
                          visit(item)

              for document in yaml.safe_load_all(rendered):
                  visit(document)
              return result

          def image_name(reference):
              return reference.split("@", 1)[0].split(":", 1)[0]

          before = container_images()
          if not any(image_name(reference) == image for reference in before):
              raise SystemExit("Imagem solicitada não encontrada nos workloads do overlay.")

          data = yaml.safe_load(path.read_text())
          entries = data.setdefault("images", [])
          matches = [entry for entry in entries if entry.get("newName", entry.get("name")) == image]
          if len(matches) > 1:
              raise SystemExit("Múltiplas regras de imagem correspondem à imagem solicitada.")
          entry = matches[0] if matches else {"name": image}
          if not matches:
              entries.append(entry)
          entry.pop("newTag", None)
          entry["digest"] = digest

          # Evita reformatar o arquivo quando o digest já está atualizado.
          if yaml.safe_load(path.read_text()) != data:
              path.write_text(yaml.safe_dump(data, sort_keys=False, allow_unicode=True))

          after = container_images()
          expected = image + "@" + digest
          if not any(reference == expected for reference in after):
              raise SystemExit("O Kustomize não aplicou o digest solicitado.")
          if any(image_name(reference) == image and reference != expected for reference in after):
              raise SystemExit("Há workloads com referências inconsistentes à imagem solicitada.")
          if sorted(ref for ref in before if image_name(ref) != image) != sorted(
              ref for ref in after if image_name(ref) != image
          ):
              raise SystemExit("A atualização alterou imagens de outros serviços.")

          # Registra a versão candidata somente após validação do GHCR,
          # da atestação e da renderização do Kustomize.
          # O registro segue junto do overlay no mesmo PR para dev.
          if os.environ["APPLICATION"] != "site-comemorativo":
              raise SystemExit("::error::Candidato individual não autorizado.")
          commit = os.environ["SOURCE_COMMIT"]
          tag = os.environ["IMAGE_TAG"]
          candidate = {
              "application": "site-comemorativo",
              "source_repository": "IFPBEsp/apae-site-comemorativo",
              "source_commit": commit,
              "image": image,
              "tag": tag,
              "digest": digest,
              "verification_run": os.environ["VERIFICATION_RUN"],
          }
          candidate_path = Path("releases/candidates/site-comemorativo") / f"{commit}.json"
          candidate_path.parent.mkdir(parents=True, exist_ok=True)
          content = json.dumps(candidate, indent=2, sort_keys=True) + "\n"
          if candidate_path.exists() and candidate_path.read_text(encoding="utf-8") != content:
              raise SystemExit("::error::Candidato existente diverge do digest verificado.")
          candidate_path.write_text(content, encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              image_id = image.rsplit("/", 1)[-1]
              branch = f"gitops/{os.environ['APPLICATION']}/{os.environ['ENVIRONMENT']}/{image_id}"
              output.write(f"branch={branch}\n")
              output.write(f"candidate={candidate_path.as_posix()}\n")
          PYTHON

      - name: Create or update image pull request
        id: pull-request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          path: infra
          base: dev
          branch: ${{ steps.image-update.outputs.branch }}
          add-paths: |
            ${{ steps.overlay.outputs.path }}/kustomization.yaml
            ${{ steps.image-update.outputs.candidate }}
          commit-message: "chore(gitops): update ${{ inputs.application }} image to ${{ inputs.image-tag }}"
          title: "chore(gitops): update ${{ inputs.application }} (${{ inputs.image }}) to ${{ inputs.image-tag }}"
          body: |
            Atualiza a imagem de `${{ inputs.application }}` no ambiente `${{ inputs.environment }}`.

            - Origem: [${{ inputs.source-repository }}](https://github.com/${{ inputs.source-repository }})
            - Commit: [${{ inputs.source-commit }}](https://github.com/${{ inputs.source-repository }}/commit/${{ inputs.source-commit }})
            - Tag: `${{ inputs.image-tag }}`
            - Referência imutável: `${{ inputs.image }}@${{ inputs.image-digest }}`
            - Overlay: `${{ steps.overlay.outputs.path }}`
            - Registro candidato: `${{ steps.image-update.outputs.candidate }}`
            - Execução: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            A tag e seu digest foram verificados no GHCR; a atestação de proveniência também foi validada.
            O overlay foi renderizado com Kustomize e a referência resultante foi verificada.
            Requer revisão e merge humanos. O sync no ArgoCD permanece manual.

      - name: Publish update summary
        shell: bash
        env:
          PR_URL: ${{ steps.pull-request.outputs.pull-request-url }}
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ inputs.image-digest }}
        run: |
          set -euo pipefail
          {
            echo "Imagem: $IMAGE@$DIGEST"
            if [[ -n "$PR_URL" ]]; then
              echo "PR: $PR_URL"
            else
              echo "Nenhuma diferença em relação à dev; nenhum novo PR necessário."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  update-release:
    name: Update complete release in homologation
    if: inputs.release-json != ''
    runs-on: ubuntu-24.04
    environment: gitops-image-updater
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      attestations: read
    concurrency:
      group: gitops-${{ inputs.application }}-${{ inputs.environment }}
      cancel-in-progress: false
    outputs:
      pull-request-url: ${{ steps.pull-request.outputs.pull-request-url }}

    steps:
      - name: Validate release metadata and contract
        shell: bash
        env:
          RELEASE_JSON: ${{ inputs.release-json }}
          APPLICATION: ${{ inputs.application }}
          ENVIRONMENT: ${{ inputs.environment }}
          SOURCE_REPOSITORY: ${{ inputs.source-repository }}
          SOURCE_COMMIT: ${{ inputs.source-commit }}
          CALLER_REPOSITORY: ${{ github.repository }}
          SINGLE_IMAGE: ${{ inputs.image }}
          SINGLE_TAG: ${{ inputs.image-tag }}
          SINGLE_DIGEST: ${{ inputs.image-digest }}
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json
          import os
          import re

          def fail(message):
              raise SystemExit(f"::error::Release invalida: {message}")

          if os.environ["CALLER_REPOSITORY"] != "IFPBEsp/APAE-INFRA":
              fail("caller nao autorizado")
          if os.environ["ENVIRONMENT"] != "dev":
              fail("somente homologacao dev e permitida")
          if any(os.environ[key] for key in ("SINGLE_IMAGE", "SINGLE_TAG", "SINGLE_DIGEST")):
              fail("nao combine release-json com entradas individuais")
          allowed_releases = {
              "apae-geral": "IFPBEsp/APAE",
              "apae-atendimento": "IFPBEsp/APAE-atendimento",
              "apae-gestao-escolar": "IFPBEsp/APAE-gestao-escolar",
          }
          application = os.environ["APPLICATION"]
          expected_repository = allowed_releases.get(application)
          if expected_repository is None:
              fail("aplicacao sem contrato de release conjunto")
          if os.environ["SOURCE_REPOSITORY"] != expected_repository:
              fail("repositorio de origem nao autorizado")
          commit = os.environ["SOURCE_COMMIT"]
          if not re.fullmatch(r"[a-f0-9]{40}", commit):
              fail("commit invalido")

          try:
              release = json.loads(os.environ["RELEASE_JSON"])
          except (ValueError, TypeError):
              fail("JSON malformado")
          if not isinstance(release, dict) or set(release) != {
              "application", "source_repository", "source_commit", "workflow_run", "images"
          }:
              fail("campos da versao invalidos")
          if (release["application"], release["source_repository"], release["source_commit"]) != (
              application, expected_repository, commit
          ):
              fail("metadados inconsistentes")
          run_url = release["workflow_run"]
          if not isinstance(run_url, str) or not re.fullmatch(
              r"https://github[.]com/" + re.escape(expected_repository) + r"/actions/runs/[0-9]+", run_url
          ):
              fail("execucao de publicacao invalida")
          images = release["images"]
          if not isinstance(images, dict) or set(images) != {"backend", "frontend"}:
              fail("backend e frontend obrigatorios")

          for component in ("backend", "frontend"):
              item = images[component]
              if not isinstance(item, dict) or set(item) != {"image", "tag", "digest", "workflow_run"}:
                  fail(f"{component}: campos invalidos")
              if item["image"] != f"ghcr.io/ifpbesp/{application}-{component}":
                  fail(f"{component}: imagem nao autorizada")
              if item["tag"] != "sha-" + commit[:7]:
                  fail(f"{component}: tag divergente do commit")
              if not isinstance(item["digest"], str) or not re.fullmatch(r"sha256:[0-9a-f]{64}", item["digest"]):
                  fail(f"{component}: digest invalido")
              if item["workflow_run"] != run_url:
                  fail(f"{component}: execucao divergente")

          with open(os.environ["RUNNER_TEMP"] + "/verified-release-input.json", "w") as handle:
              json.dump(release, handle, indent=2, sort_keys=True)
              handle.write("\n")
          print("Contrato de release validado; imagens ainda precisam de verificacao externa.")
          PYTHON

      - name: Checkout trusted automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: IFPBEsp/APAE-INFRA
          ref: ${{ github.sha }}
          token: ${{ github.token }}
          persist-credentials: false

      - name: Verify both GHCR tags and digests
        shell: bash
        env:
          GHCR_READ_USERNAME: ${{ secrets.GHCR_READ_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for component in backend frontend; do
            export IMAGE="$(jq -er --arg component "$component" '.images[$component].image' "$RUNNER_TEMP/verified-release-input.json")"
            export IMAGE_TAG="$(jq -er --arg component "$component" '.images[$component].tag' "$RUNNER_TEMP/verified-release-input.json")"
            export IMAGE_DIGEST="$(jq -er --arg component "$component" '.images[$component].digest' "$RUNNER_TEMP/verified-release-input.json")"
            python3 scripts/ci/verify_ghcr_image.py
          done

      - name: Authenticate to GHCR for attestation verification
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_READ_USERNAME != '' && secrets.GHCR_READ_TOKEN != '' && secrets.GHCR_READ_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_READ_USERNAME != '' && secrets.GHCR_READ_TOKEN != '' && secrets.GHCR_READ_TOKEN || github.token }}

      - name: Verify both build attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ inputs.source-repository }}
          SOURCE_COMMIT: ${{ inputs.source-commit }}
        run: |
          set -euo pipefail
          for component in backend frontend; do
            image="$(jq -er --arg component "$component" '.images[$component].image' "$RUNNER_TEMP/verified-release-input.json")"
            digest="$(jq -er --arg component "$component" '.images[$component].digest' "$RUNNER_TEMP/verified-release-input.json")"
            gh attestation verify "oci://${image}@${digest}" \
              --bundle-from-oci \
              --repo "$SOURCE_REPOSITORY" \
              --signer-workflow "IFPBEsp/APAE-INFRA/.github/workflows/docker-build-publish-image.yml" \
              --source-ref "refs/heads/main" \
              --source-digest "$SOURCE_COMMIT"
          done

      - name: Generate image updater GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.IMAGE_UPDATER_APP_ID }}
          private-key: ${{ secrets.IMAGE_UPDATER_APP_PRIVATE_KEY }}
          owner: IFPBEsp
          repositories: APAE-INFRA
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout homologation manifests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: IFPBEsp/APAE-INFRA
          ref: dev
          path: infra
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Set up approved Kustomize
        uses: ./.github/actions/setup-kustomize

      - name: Install YAML editor
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/gitops-yaml"
          "$RUNNER_TEMP/gitops-yaml/bin/pip" install --disable-pip-version-check 'PyYAML==6.0.3'

      - name: Update both digests and record candidate atomically
        id: release-update
        shell: bash
        working-directory: infra
        env:
          SOURCE_COMMIT: ${{ inputs.source-commit }}
          APPLICATION: ${{ inputs.application }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitops-yaml/bin/python" - <<'PYTHON'
          import json
          import os
          import subprocess
          from pathlib import Path

          import yaml

          release = json.loads((Path(os.environ["RUNNER_TEMP"]) / "verified-release-input.json").read_text())
          application = os.environ["APPLICATION"]
          if application not in {"apae-geral", "apae-atendimento", "apae-gestao-escolar"}:
              raise SystemExit("::error::Aplicacao nao autorizada para release conjunta.")
          overlay = Path("kubernetes") / application / "overlays/dev"
          path = overlay / "kustomization.yaml"
          if not path.is_file():
              raise SystemExit("::error::Overlay dev ausente; depende da issue #92.")

          def images_in_workloads():
              rendered = subprocess.check_output(["kustomize", "build", str(overlay)], text=True)
              found = []
              def visit(value):
                  if isinstance(value, dict):
                      for key, child in value.items():
                          if key in ("containers", "initContainers", "ephemeralContainers"):
                              if not isinstance(child, list):
                                  raise SystemExit("Lista de containers invalida")
                              for container in child:
                                  found.append(container["image"])
                          else:
                              visit(child)
                  elif isinstance(value, list):
                      for child in value:
                          visit(child)
              for document in yaml.safe_load_all(rendered):
                  visit(document)
              return found

          targets = {release["images"][component]["image"]: release["images"][component]["digest"]
                     for component in ("backend", "frontend")}
          def image_name(reference):
              return reference.split("@", 1)[0].split(":", 1)[0]

          before = images_in_workloads()
          for image in targets:
              if not any(image_name(ref) == image for ref in before):
                  raise SystemExit(f"::error::Imagem ausente nos workloads: {image}")

          original = yaml.safe_load(path.read_text())
          if not isinstance(original, dict):
              raise SystemExit("::error::Kustomization invalido")
          data = yaml.safe_load(path.read_text())
          entries = data.setdefault("images", [])
          if not isinstance(entries, list):
              raise SystemExit("::error::images deve ser lista")
          for image, digest in targets.items():
              matches = [entry for entry in entries if isinstance(entry, dict) and entry.get("newName", entry.get("name")) == image]
              if len(matches) > 1:
                  raise SystemExit("::error::Regras duplicadas para imagem")
              entry = matches[0] if matches else {"name": image}
              if not matches:
                  entries.append(entry)
              entry.pop("newTag", None)
              entry["digest"] = digest
          if data != original:
              path.write_text(yaml.safe_dump(data, sort_keys=False, allow_unicode=True))

          after = images_in_workloads()
          for image, digest in targets.items():
              expected = image + "@" + digest
              if not any(ref == expected for ref in after):
                  raise SystemExit(f"::error::Digest nao aplicado pelo Kustomize: {image}")
              if any(image_name(ref) == image and ref != expected for ref in after):
                  raise SystemExit("::error::Referencia inconsistente em workload")
          if sorted(ref for ref in before if image_name(ref) not in targets) != sorted(
              ref for ref in after if image_name(ref) not in targets
          ):
              raise SystemExit("::error::Outras imagens foram alteradas")

          candidate = Path("releases/candidates") / application / (release["source_commit"] + ".json")
          candidate.parent.mkdir(parents=True, exist_ok=True)
          candidate.write_text(json.dumps(release, indent=2, sort_keys=True) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"candidate={candidate.as_posix()}\n")
              output.write(f"overlay={path.as_posix()}\n")
              output.write(f"branch=gitops/{application}/dev/release\n")
          PYTHON

      - name: Create or update complete release PR
        id: pull-request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          path: infra
          base: dev
          branch: ${{ steps.release-update.outputs.branch }}
          add-paths: |
            ${{ steps.release-update.outputs.overlay }}
            ${{ steps.release-update.outputs.candidate }}
          commit-message: "chore(gitops): update ${{ inputs.application }} homologation release"
          title: "chore(gitops): update ${{ inputs.application }} complete release in dev"
          body: |
            Atualiza frontend e backend **juntos**, para uma unica versao candidata de homologacao.

            - Repositorio de origem: `${{ inputs.source-repository }}`
            - Commit: `${{ inputs.source-commit }}`
            - Registro candidato: `${{ steps.release-update.outputs.candidate }}`
            - Backend: digest verificado no GHCR e por atestacao
            - Frontend: digest verificado no GHCR e por atestacao
            - Workflow receptor: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            **Nao representa aprovacao de homologacao e nao autoriza promocao a producao.**
            Requer revisao humana; ArgoCD segue a politica configurada no ambiente.

      - name: Publish candidate summary
        shell: bash
        env:
          PR_URL: ${{ steps.pull-request.outputs.pull-request-url }}
          CANDIDATE: ${{ steps.release-update.outputs.candidate }}
        run: |
          set -euo pipefail
          echo "Registro candidato: $CANDIDATE" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$PR_URL" ]]; then
            echo "PR: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nenhuma mudanca pendente no overlay dev." >> "$GITHUB_STEP_SUMMARY"
          fi
