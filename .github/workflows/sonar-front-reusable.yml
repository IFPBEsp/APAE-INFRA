name: SonarQube Analysis - Frontend

on:
  workflow_call:
    inputs:
      project-key:
        description: 'Chave do projeto no SonarQube Cloud'
        required: true
        type: string
      organization:
        description: 'Organization key do SonarQube Cloud'
        required: true
        type: string
    secrets:
      SONAR_TOKEN:
        description: 'Token de autenticação do SonarQube'
        required: true

jobs:
  sonar-node:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:ci --if-present

      - name: SonarQube Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ inputs.project-key }}
            -Dsonar.organization=${{ inputs.organization }}
            -Dsonar.host.url=https://sonarcloud.io