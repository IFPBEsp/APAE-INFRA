name: SonarQube Analysis - Fullstack

on:
  workflow_call:
    inputs:
      backend-project-key:
        description: 'Chave do projeto Backend no SonarQube Cloud'
        required: true
        type: string
      frontend-project-key:
        description: 'Chave do projeto Frontend no SonarQube Cloud'
        required: true
        type: string
      backend-dir:
        description: 'Caminho da pasta do backend'
        required: true
        type: string
      frontend-dir:
        description: 'Caminho da pasta do frontend'
        required: true
        type: string
      organization:
        description: 'Organization key do SonarQube Cloud'
        required: true
        type: string
    secrets:
      SONAR_TOKEN:
        description: 'Token de autenticação do SonarQube'
        required: true

jobs:
  sonar-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build and Analyze Backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn clean verify sonar:sonar \
            -Dsonar.projectKey=${{ inputs.backend-project-key }} \
            -Dsonar.organization=${{ inputs.organization }} \
            -Dsonar.host.url=https://sonarcloud.io
        working-directory: ${{ inputs.backend-dir }}

  sonar-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (Frontend)
        run: npm ci
        working-directory: ${{ inputs.frontend-dir }}

      - name: Run tests with coverage (Frontend)
        run: npm run test:ci --if-present
        working-directory: ${{ inputs.frontend-dir }}

      - name: SonarQube Scan (Frontend)
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: ${{ inputs.frontend-dir }}
          args: >
            -Dsonar.projectKey=${{ inputs.frontend-project-key }}
            -Dsonar.organization=${{ inputs.organization }}
            -Dsonar.host.url=https://sonarcloud.io