name: Test Image Updater App


on:
  push:
    branches:
      - 82-ci-criar-workflow-reutilizavel-de-atualizacao-da-tag-de-imagem-nos-manifests-do-apae-infra
    paths:
      - .github/workflows/test-image-updater-app.yml

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-app:
    name: Validate GitHub App Authentication
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.IMAGE_UPDATER_APP_ID }}
          private-key: ${{ secrets.IMAGE_UPDATER_APP_PRIVATE_KEY }}
          owner: IFPBEsp
          repositories: APAE-INFRA
          permission-contents: write
          permission-pull-requests: write

      - name: Verify App access to APAE-INFRA
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          gh api \
            repos/IFPBEsp/APAE-INFRA \
            --jq '{repository: .full_name, private: .private}'

          echo "GitHub App autenticado com sucesso."


  test-invalid-inputs:
    name: Reject Invalid GitOps Inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run invalid input tests
        shell: bash
        run: |
          set -euo pipefail

          python3 -m venv "$RUNNER_TEMP/gitops-tests"
          "$RUNNER_TEMP/gitops-tests/bin/pip" install \
            --disable-pip-version-check \
            'PyYAML==6.0.3'

          "$RUNNER_TEMP/gitops-tests/bin/python" \
            -m unittest \
            tests.test_update_image_overlay.InputsTest \
            -v
