name: Reusable Docker Build, Scan and Publish

on:
  workflow_call:
    inputs:
      context:
        description: "Contexto do build Docker"
        required: true
        type: string

      dockerfile:
        description: "Caminho do Dockerfile"
        required: true
        type: string

      image-name:
        description: "Nome da imagem no GHCR, sem registry/owner"
        required: true
        type: string

      build-args:
        description: "Build args adicionais, um por linha"
        required: false
        type: string
        default: ""

      platforms:
        description: "Lista JSON de plataformas, ex.: [\"linux/amd64\"]"
        required: false
        type: string
        default: '["linux/amd64"]'

      target:
        description: "Stage alvo do Dockerfile"
        required: false
        type: string
        default: ""

      scan-severity:
        description: "Severidades que bloqueiam a promoção"
        required: false
        type: string
        default: "HIGH,CRITICAL"

    outputs:
      image:
        description: "Nome completo da imagem no GHCR"
        value: ${{ jobs.publish.outputs.image }}

      digest:
        description: "Digest OCI final da imagem promovida"
        value: ${{ jobs.publish.outputs.digest }}

      immutable-reference:
        description: "Referência imutável image@sha256:digest"
        value: ${{ jobs.publish.outputs.immutable-reference }}

      sha-tag:
        description: "Tag humana baseada no commit"
        value: ${{ jobs.publish.outputs.sha-tag }}

      source-repository:
        description: "Repositório de origem da imagem"
        value: ${{ jobs.publish.outputs.source-repository }}

      source-commit:
        description: "Commit completo de origem"
        value: ${{ jobs.publish.outputs.source-commit }}

      source-ref:
        description: "Referência Git de origem"
        value: ${{ jobs.publish.outputs.source-ref }}

      workflow-run-id:
        description: "ID da execução de publicação"
        value: ${{ jobs.publish.outputs.workflow-run-id }}

      workflow-run-url:
        description: "URL da execução de publicação"
        value: ${{ jobs.publish.outputs.workflow-run-url }}

jobs:
  build-and-scan:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    name: Build and scan (${{ matrix.platform }})
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify source is current main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          if [[ "$SOURCE_REF" != "refs/heads/main" ]]; then
            echo "::error::Somente imagens originadas da main podem ser publicadas ou recebidas pela infraestrutura."
            exit 1
          fi

          main_commit="$(gh api --method GET "repos/${SOURCE_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ ! "$main_commit" =~ ^[a-f0-9]{40}$ || "$main_commit" != "$SOURCE_COMMIT" ]]; then
            echo "::error::O commit da imagem não é mais o commit atual da main. Publique a revisão atual antes de atualizar a infraestrutura."
            exit 1
          fi

      - name: Normalize image owner
        id: image
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ inputs.image-name }}
        run: |
          set -euo pipefail

          owner="${OWNER,,}"
          image_name="${IMAGE_NAME,,}"

          echo "name=ghcr.io/${owner}/${image_name}" >> "$GITHUB_OUTPUT"

      - name: Prepare platform metadata
        id: platform
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail

          normalized="${PLATFORM//\//-}"

          echo "name=${normalized}" >> "$GITHUB_OUTPUT"

      - name: Prepare build metadata
        id: build-meta
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          short_sha="${COMMIT_SHA:0:7}"
          {
            echo "short-sha=${short_sha}"
            echo "version=sha-${short_sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare build arguments
        id: build-args
        shell: bash
        env:
          INPUT_BUILD_ARGS: ${{ inputs.build-args }}
          COMMIT_SHA: ${{ github.sha }}
          VERSION: ${{ steps.build-meta.outputs.version }}
        run: |
          set -euo pipefail

          {
            echo "args<<EOF"
            echo "APP_VERSION=${VERSION}"
            echo "VCS_REF=${COMMIT_SHA}"
            if [[ -n "${INPUT_BUILD_ARGS}" ]]; then
              echo "${INPUT_BUILD_ARGS}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: matrix.platform != 'linux/amd64'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          target: ${{ inputs.target }}
          platforms: ${{ matrix.platform }}
          build-args: ${{ steps.build-args.outputs.args }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.build-meta.outputs.version }}
          outputs: >-
            type=image,
            name=${{ steps.image.outputs.name }},
            push-by-digest=true,
            name-canonical=true,
            push=true
          cache-from: type=gha,scope=${{ inputs.image-name }}-${{ steps.platform.outputs.name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image-name }}-${{ steps.platform.outputs.name }}

      - name: Scan image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: ${{ inputs.scan-severity }}
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}

      - name: Persist digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/digests"

          digest="${DIGEST#sha256:}"

          if [[ -z "$digest" || "$digest" == "$DIGEST" ]]; then
            echo "::error::Digest OCI inválido: $DIGEST"
            exit 1
          fi

          touch "$RUNNER_TEMP/digests/$digest"

      - name: Upload platform digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ inputs.image-name }}-${{ steps.platform.outputs.name }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Promote approved image
    needs: build-and-scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    outputs:
      image: ${{ steps.result.outputs.image }}
      digest: ${{ steps.result.outputs.digest }}
      immutable-reference: ${{ steps.result.outputs.immutable-reference }}
      sha-tag: ${{ steps.result.outputs.sha-tag }}
      source-repository: ${{ steps.result.outputs.source-repository }}
      source-commit: ${{ steps.result.outputs.source-commit }}
      source-ref: ${{ steps.result.outputs.source-ref }}
      workflow-run-id: ${{ steps.result.outputs.workflow-run-id }}
      workflow-run-url: ${{ steps.result.outputs.workflow-run-url }}

    steps:
      - name: Normalize image owner
        id: image
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ inputs.image-name }}
        run: |
          set -euo pipefail

          owner="${OWNER,,}"
          image_name="${IMAGE_NAME,,}"

          echo "name=ghcr.io/${owner}/${image_name}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Download approved digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digest-${{ inputs.image-name }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Generate final tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 7
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Create candidate manifest
        id: candidate
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGESTS_DIR: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail

          mapfile -t digest_files < <(
            find "$DIGESTS_DIR" -maxdepth 1 -type f -printf '%f\n' | sort
          )

          if (( ${#digest_files[@]} == 0 )); then
            echo "::error::Nenhum digest aprovado foi encontrado."
            exit 1
          fi

          sources=()

          for digest in "${digest_files[@]}"; do
            if [[ ! "$digest" =~ ^[a-f0-9]{64}$ ]]; then
              echo "::error::Digest inválido encontrado: $digest"
              exit 1
            fi

            sources+=("${IMAGE}@sha256:${digest}")
          done

          candidate_tag="${IMAGE}:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          metadata_file="$RUNNER_TEMP/image-metadata.json"

          docker buildx imagetools create \
            --metadata-file "$metadata_file" \
            --tag "$candidate_tag" \
            "${sources[@]}"

          digest="$(
            jq -r '.["containerimage.descriptor"].digest' \
              "$metadata_file"
          )"

          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Digest final inválido: $digest"
            exit 1
          fi

          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Verify candidate image
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          set -euo pipefail

          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" > /dev/null

      - name: Attest image build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.candidate.outputs.digest }}
          push-to-registry: true

      - name: Verify image build provenance
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh attestation verify "oci://${IMAGE}@${DIGEST}" \
            --bundle-from-oci \
            --repo "$SOURCE_REPOSITORY" \
            --signer-workflow "IFPBEsp/APAE-INFRA/.github/workflows/docker-build-publish-image.yml" \
            --source-ref "$SOURCE_REF" \
            --source-digest "$SOURCE_COMMIT" \
            --predicate-type "https://slsa.dev/provenance/v1"

      - name: Generate image SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.candidate.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          syft-version: v1.54.1
          artifact-name: sbom-${{ inputs.image-name }}.spdx.json
          upload-artifact: true
          upload-release-assets: false
          dependency-snapshot: false

      - name: Validate image SBOM
        id: sbom
        shell: bash
        env:
          SBOM_PATH: ${{ runner.temp }}/sbom.spdx.json
        run: |
          set -euo pipefail

          if [[ ! -s "$SBOM_PATH" ]]; then
            echo "::error::O SBOM não foi gerado."
            exit 1
          fi

          spdx_version="$(jq -er '.spdxVersion' "$SBOM_PATH")"
          if [[ ! "$spdx_version" =~ ^SPDX-[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Versão SPDX inválida no SBOM: $spdx_version"
            exit 1
          fi

          package_count="$(jq -er '.packages | length' "$SBOM_PATH")"
          if (( package_count == 0 )); then
            echo "::error::O SBOM não contém pacotes."
            exit 1
          fi

          {
            echo "path=$SBOM_PATH"
            echo "predicate-type=https://spdx.dev/Document/v${spdx_version#SPDX-}"
            echo "package-count=$package_count"
          } >> "$GITHUB_OUTPUT"

      - name: Attest image SBOM
        id: sbom-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.candidate.outputs.digest }}
          sbom-path: ${{ steps.sbom.outputs.path }}
          push-to-registry: true

      - name: Verify image SBOM attestation
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          PREDICATE_TYPE: ${{ steps.sbom.outputs.predicate-type }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh attestation verify "oci://${IMAGE}@${DIGEST}" \
            --bundle-from-oci \
            --repo "$SOURCE_REPOSITORY" \
            --signer-workflow "IFPBEsp/APAE-INFRA/.github/workflows/docker-build-publish-image.yml" \
            --source-ref "$SOURCE_REF" \
            --source-digest "$SOURCE_COMMIT" \
            --predicate-type "$PREDICATE_TYPE"

      - name: Sign candidate image with Cosign
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          set -euo pipefail

          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verify Cosign signature
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          # github.workflow_ref aponta para o workflow do caller; o certificado
          # identifica este workflow reutilizável, chamado por @main ou por SHA.
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp='^https://github\.com/IFPBEsp/APAE-INFRA/\.github/workflows/docker-build-publish-image\.yml@(refs/heads/main|[0-9a-f]{40})$' \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --certificate-github-workflow-repository="$SOURCE_REPOSITORY" \
            --certificate-github-workflow-ref="$SOURCE_REF" \
            --certificate-github-workflow-sha="$SOURCE_COMMIT"

      - name: Recheck main before promotion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          if [[ "$SOURCE_REF" != "refs/heads/main" ]]; then
            echo "::error::Somente imagens originadas da main podem ser publicadas ou recebidas pela infraestrutura."
            exit 1
          fi

          main_commit="$(gh api --method GET "repos/${SOURCE_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ ! "$main_commit" =~ ^[a-f0-9]{40}$ || "$main_commit" != "$SOURCE_COMMIT" ]]; then
            echo "::error::O commit da imagem não é mais o commit atual da main. Publique a revisão atual antes de atualizar a infraestrutura."
            exit 1
          fi

      - name: Promote verified image to final tags
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          tag_args=()

          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            tag_args+=(--tag "$tag")
          done <<< "$TAGS"

          if (( ${#tag_args[@]} == 0 )); then
            echo "::error::Nenhuma tag final foi gerada."
            exit 1
          fi

          metadata_file="$RUNNER_TEMP/promoted-image-metadata.json"

          docker buildx imagetools create \
            --prefer-index=false \
            --metadata-file "$metadata_file" \
            "${tag_args[@]}" \
            "${IMAGE}@${DIGEST}"

          promoted_digest="$(
            jq -r '.["containerimage.descriptor"].digest' \
              "$metadata_file"
          )"

          if [[ "$promoted_digest" != "$DIGEST" ]]; then
            echo "::error::O digest promovido difere do digest assinado."
            exit 1
          fi

      - name: Export workflow outputs
        id: result
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
          COMMIT_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          short_sha="${COMMIT_SHA:0:7}"
          sha_tag="sha-${short_sha}"

          {
            echo "image=$IMAGE"
            echo "digest=$DIGEST"
            echo "sha-tag=$sha_tag"
            echo "immutable-reference=${IMAGE}@${DIGEST}"
            echo "source-repository=$SOURCE_REPOSITORY"
            echo "source-commit=$COMMIT_SHA"
            echo "source-ref=$SOURCE_REF"
            echo "workflow-run-id=$WORKFLOW_RUN_ID"
            echo "workflow-run-url=$WORKFLOW_RUN_URL"
          }  >> "$GITHUB_OUTPUT"

      - name: Publish workflow summary
        shell: bash
        env:
          IMAGE: ${{ steps.result.outputs.image }}
          DIGEST: ${{ steps.result.outputs.digest }}
          SHA_TAG: ${{ steps.result.outputs.sha-tag }}
          IMMUTABLE_REFERENCE: ${{ steps.result.outputs.immutable-reference }}
          TAGS: ${{ steps.meta.outputs.tags }}
          SOURCE_REPOSITORY: ${{ steps.result.outputs.source-repository }}
          SOURCE_COMMIT: ${{ steps.result.outputs.source-commit }}
          SOURCE_REF: ${{ steps.result.outputs.source-ref }}
          WORKFLOW_RUN_ID: ${{ steps.result.outputs.workflow-run-id }}
          WORKFLOW_RUN_URL: ${{ steps.result.outputs.workflow-run-url }}
          PROVENANCE_URL: ${{ steps.provenance.outputs.attestation-url }}
          SBOM_ATTESTATION_URL: ${{ steps.sbom-attestation.outputs.attestation-url }}
          SBOM_PREDICATE_TYPE: ${{ steps.sbom.outputs.predicate-type }}
          SBOM_PACKAGE_COUNT: ${{ steps.sbom.outputs.package-count }}
        run: |
          set -euo pipefail

          {
            echo "## Docker image publication"
            echo

            echo "### Build origin"
            echo
            echo "- Repository: \`${SOURCE_REPOSITORY}\`"
            echo "- Commit: \`${SOURCE_COMMIT}\`"
            echo "- Git ref: \`${SOURCE_REF}\`"
            echo "- Workflow run ID: \`${WORKFLOW_RUN_ID}\`"
            echo "- Workflow execution: ${WORKFLOW_RUN_URL}"
            echo

            if [[ "$SOURCE_REF" == "refs/heads/main" ]]; then
              echo "- Promotion eligibility: main publication candidate"
            else
              echo "- Promotion eligibility: development only"
            fi

            echo

            echo "### Published image"
            echo
            echo "- Image: \`${IMAGE}\`"
            echo "- Commit tag: \`${SHA_TAG}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Immutable reference: \`${IMMUTABLE_REFERENCE}\`"
            echo

            echo "### Attestations"
            echo
            echo "- Build provenance (\`https://slsa.dev/provenance/v1\`): ${PROVENANCE_URL}"
            echo "- SBOM (\`${SBOM_PREDICATE_TYPE}\`, ${SBOM_PACKAGE_COUNT} packages): ${SBOM_ATTESTATION_URL}"
            echo

            echo "### Published tags"
            echo

            while IFS= read -r tag; do
              [[ -z "$tag" ]] && continue
              echo "- \`${tag}\`"
            done <<< "$TAGS"

          } >> "$GITHUB_STEP_SUMMARY"
