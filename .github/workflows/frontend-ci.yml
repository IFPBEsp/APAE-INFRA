name: Reusable Node.js Frontend CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Diretório da aplicação frontend, relativo à raiz do repositório"
        required: true
        type: string

      package-manager:
        description: "Gerenciador de pacotes: detect, pnpm ou npm"
        required: false
        type: string
        default: "detect"

      node-version:
        description: "Versão do Node.js"
        required: false
        type: string
        default: "22"

      run-lint:
        description: "Executa a etapa de lint"
        required: false
        type: boolean
        default: true

      typecheck-command:
        description: "Comando de typecheck; vazio desabilita a etapa"
        required: false
        type: string
        default: "tsc --noEmit"

      run-tests:
        description: "Executa a etapa de testes"
        required: false
        type: boolean
        default: false

      run-build:
        description: "Executa a etapa de build"
        required: false
        type: boolean
        default: true

      build-env:
        description: "Variáveis NEXT_PUBLIC_* no formato CHAVE=VALOR, uma por linha"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Prepare workspace and detect package manager
        id: prepare
        shell: bash
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          raw_directory = os.environ["WORKING_DIRECTORY"].strip()

          if not raw_directory:
              raise SystemExit("::error::working-directory é obrigatório.")

          if any(char in raw_directory for char in "\r\n\0"):
              raise SystemExit(
                  "::error::working-directory contém caracteres inválidos."
              )

          relative = Path(raw_directory)

          if relative.is_absolute() or ".." in relative.parts:
              raise SystemExit(f"::error::Caminho inválido: {raw_directory}")

          target = (workspace / relative).resolve()

          if target != workspace and workspace not in target.parents:
              raise SystemExit(
                  f"::error::Diretório fora do workspace: {raw_directory}"
              )

          if not target.is_dir():
              raise SystemExit(
                  f"::error::Diretório não encontrado: {raw_directory}"
              )

          if not (target / "package.json").is_file():
              raise SystemExit(
                  f"::error::package.json não encontrado em: {raw_directory}"
              )

          def find_lockfile(directory):
              for name, detected in (
                  ("pnpm-lock.yaml", "pnpm"),
                  ("package-lock.json", "npm"),
              ):
                  if (directory / name).is_file():
                      return name, detected
              return None, None

          requested = os.environ["PACKAGE_MANAGER"].strip().lower()

          if requested not in {"detect", "pnpm", "npm"}:
              raise SystemExit(
                  f"::error::package-manager inválido: {requested}"
              )

          target_lockfile, target_manager = find_lockfile(target)
          root_lockfile, root_manager = find_lockfile(workspace)
          root_is_workspace = (workspace / "pnpm-workspace.yaml").is_file()

          if requested == "detect":
              if target_lockfile:
                  install_dir = target
                  lockfile, manager = target_lockfile, target_manager
              elif root_lockfile or root_is_workspace:
                  install_dir = workspace
                  lockfile, manager = root_lockfile, root_manager
                  if not lockfile:
                      raise SystemExit(
                          "::error::pnpm-workspace.yaml encontrado na raiz, "
                          "mas nenhum lockfile (pnpm-lock.yaml ou "
                          "package-lock.json)."
                      )
              else:
                  raise SystemExit(
                      "::error::Nenhum lockfile encontrado em "
                      "working-directory nem na raiz (pnpm-lock.yaml ou "
                      "package-lock.json)."
                  )
          else:
              manager = requested
              lockfile = (
                  "pnpm-lock.yaml"
                  if manager == "pnpm"
                  else "package-lock.json"
              )
              if (target / lockfile).is_file():
                  install_dir = target
              elif (workspace / lockfile).is_file() or (
                  manager == "pnpm" and root_is_workspace
              ):
                  install_dir = workspace
              else:
                  raise SystemExit(
                      f"::error::Lockfile obrigatório não encontrado: {lockfile}"
                  )

          lockfile_path = (install_dir / lockfile).relative_to(
              workspace
          ).as_posix()

          if not (install_dir / lockfile).is_file():
              raise SystemExit(
                  "::error::Lockfile obrigatório não encontrado: "
                  f"{lockfile_path}"
              )

          install_relative = install_dir.relative_to(workspace).as_posix()
          install_package_json = install_dir / "package.json"

          if not install_package_json.is_file():
              raise SystemExit(
                  "::error::package.json não encontrado no diretório de "
                  f"instalação: {install_relative}"
              )

          package_json = json.loads(
              install_package_json.read_text(encoding="utf-8")
          )

          package_manager_field = package_json.get("packageManager", "")
          has_pnpm_package_manager = (
              isinstance(package_manager_field, str)
              and package_manager_field.startswith("pnpm@")
          )
          pnpm_version = "" if has_pnpm_package_manager else "10"

          if has_pnpm_package_manager:
              match = re.match(
                  r"^pnpm@([0-9][0-9A-Za-z._-]*)", package_manager_field
              )
              declared_pnpm_version = match.group(1) if match else "?"
          else:
              declared_pnpm_version = "10 (padrão)"

          app_package = json.loads(
              (target / "package.json").read_text(encoding="utf-8")
          )
          dependency_blocks = (
              "dependencies",
              "devDependencies",
              "peerDependencies",
              "optionalDependencies",
          )
          is_next = any(
              isinstance(app_package.get(block), dict)
              and "next" in app_package[block]
              for block in dependency_blocks
          )

          directory = target.relative_to(workspace).as_posix()

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"package-manager={manager}\n")
              output.write(f"working-directory={directory}\n")
              output.write(f"install-dir={install_relative}\n")
              output.write(f"lockfile-path={lockfile_path}\n")
              output.write(f"pnpm-version={pnpm_version}\n")
              output.write(f"is-next={'true' if is_next else 'false'}\n")

          print(f"Diretório: {directory}")
          print(f"Diretório de instalação: {install_relative}")
          print(f"Gerenciador de pacotes: {manager}")
          print(f"Lockfile: {lockfile_path}")
          print(f"Versão do pnpm: {declared_pnpm_version}")
          print(f"Next.js: {'sim' if is_next else 'não'}")
          PY

      - name: Setup pnpm from packageManager
        if: steps.prepare.outputs.package-manager == 'pnpm' && steps.prepare.outputs.pnpm-version == ''
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: ${{ steps.prepare.outputs.install-dir }}/package.json
          run_install: false

      - name: Setup pnpm with default version
        if: steps.prepare.outputs.package-manager == 'pnpm' && steps.prepare.outputs.pnpm-version != ''
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ steps.prepare.outputs.pnpm-version }}
          package_json_file: ${{ steps.prepare.outputs.install-dir }}/package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ steps.prepare.outputs.package-manager }}
          cache-dependency-path: ${{ steps.prepare.outputs.lockfile-path }}

      - name: Install dependencies
        shell: bash
        working-directory: ${{ steps.prepare.outputs.install-dir }}
        env:
          PACKAGE_MANAGER: ${{ steps.prepare.outputs.package-manager }}
        run: |
          set -euo pipefail

          if [[ "$PACKAGE_MANAGER" == "pnpm" ]]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: Lint
        if: inputs.run-lint
        shell: bash
        working-directory: ${{ steps.prepare.outputs.working-directory }}
        env:
          PACKAGE_MANAGER: ${{ steps.prepare.outputs.package-manager }}
        run: |
          set -euo pipefail

          if [[ "$PACKAGE_MANAGER" == "pnpm" ]]; then
            pnpm run lint
          else
            npm run lint
          fi

      - name: Next.js typegen
        if: inputs.typecheck-command != '' && steps.prepare.outputs.is-next == 'true'
        shell: bash
        working-directory: ${{ steps.prepare.outputs.working-directory }}
        env:
          PACKAGE_MANAGER: ${{ steps.prepare.outputs.package-manager }}
        run: |
          set -euo pipefail

          export PATH="$PWD/node_modules/.bin:$PATH"

          if [[ "$PACKAGE_MANAGER" == "pnpm" ]]; then
            pnpm exec next typegen || echo "::warning::Falha ao executar 'pnpm exec next typegen'; seguindo para o typecheck."
          else
            npx next typegen || echo "::warning::Falha ao executar 'npx next typegen'; seguindo para o typecheck."
          fi

      - name: Typecheck
        if: inputs.typecheck-command != ''
        shell: bash
        working-directory: ${{ steps.prepare.outputs.working-directory }}
        env:
          TYPECHECK_COMMAND: ${{ inputs.typecheck-command }}
        run: |
          set -euo pipefail

          export PATH="$PWD/node_modules/.bin:$PATH"
          bash -c "$TYPECHECK_COMMAND"

      - name: Tests
        if: inputs.run-tests
        shell: bash
        working-directory: ${{ steps.prepare.outputs.working-directory }}
        env:
          PACKAGE_MANAGER: ${{ steps.prepare.outputs.package-manager }}
        run: |
          set -euo pipefail

          if [[ "$PACKAGE_MANAGER" == "pnpm" ]]; then
            pnpm run test
          else
            npm run test
          fi

      - name: Build
        if: inputs.run-build == true
        shell: bash
        working-directory: ${{ steps.prepare.outputs.working-directory }}
        env:
          PACKAGE_MANAGER: ${{ steps.prepare.outputs.package-manager }}
          BUILD_ENV: ${{ inputs.build-env }}
        run: |
          set -euo pipefail

          while IFS= read -r line || [[ -n "$line" ]]; do
            line="${line%$'\r'}"

            [[ -z "${line//[[:space:]]/}" ]] && continue

            if [[ ! "$line" =~ ^(NEXT_PUBLIC_[A-Za-z0-9_]+)=(.*)$ ]]; then
              echo "::error::build-env inválido: use NEXT_PUBLIC_CHAVE=valor, uma por linha."
              exit 1
            fi

            key="${BASH_REMATCH[1]}"
            value="${BASH_REMATCH[2]}"

            export "$key=$value"
            echo "::notice::Variável de build definida: $key"
          done <<< "$BUILD_ENV"

          if [[ "$PACKAGE_MANAGER" == "pnpm" ]]; then
            pnpm run build
          else
            npm run build
          fi
