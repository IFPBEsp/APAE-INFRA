name: Test Image Updater Call

on:
  push:
    branches:
      - 82-ci-criar-workflow-reutilizavel-de-atualizacao-da-tag-de-imagem-nos-manifests-do-apae-infra
    paths:
      - .github/workflows/test-image-updater-call.yml

permissions:
  contents: read

jobs:
  test-reusable:
    name: Test Reusable Workflow
    uses: ./.github/workflows/update-image-overlay-reusable.yml
    with:
      application: apae-geral
      environment: prod
      image: ghcr.io/ifpbesp/apae-geral-backend
      image-tag: sha-abcdef0
      image-digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      source-repository: IFPBEsp/APAE
      source-commit: abcdef0000000000000000000000000000000000
    secrets:
      IMAGE_UPDATER_APP_ID: ${{ secrets.IMAGE_UPDATER_APP_ID }}
      IMAGE_UPDATER_APP_PRIVATE_KEY: ${{ secrets.IMAGE_UPDATER_APP_PRIVATE_KEY }}
