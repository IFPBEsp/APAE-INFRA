name: Validate Renovate Configuration

on:
  pull_request:
    paths:
      - default.json
      - .github/renovate.json
      - .github/workflows/renovate-config-test.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Renovate configuration
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Validate Renovate configuration
        run: |
          npx --yes --package renovate@44.165.1 renovate-config-validator \
            --strict default.json .github/renovate.json
