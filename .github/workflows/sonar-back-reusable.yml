name: SonarQube Analysis - Backend

on:
  workflow_call:
    inputs:
      project-key:
        description: 'Chave do projeto no SonarQube Cloud'
        required: true
        type: string
      organization:
        description: 'Organization key do SonarQube Cloud'
        required: true
        type: string
    secrets:
      SONAR_TOKEN:
        description: 'Token de autenticação do SonarQube'
        required: true

jobs:
  sonar-maven:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build and Analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn clean verify sonar:sonar \
            -Dsonar.projectKey=${{ inputs.project-key }} \
            -Dsonar.organization=${{ inputs.organization }} \
            -Dsonar.host.url=https://sonarcloud.io