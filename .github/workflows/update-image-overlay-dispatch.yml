name: Dispatch Update Image Overlay

on:
  repository_dispatch:
    types:
      - gitops-image-published

permissions:
  contents: read
  packages: read

jobs:
  validate-payload:
    name: Validate dispatch structure
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    outputs:
      application: ${{ steps.payload.outputs.application }}
      environment: ${{ steps.payload.outputs.environment }}
      image: ${{ steps.payload.outputs.image }}
      image-tag: ${{ steps.payload.outputs.image_tag }}
      image-digest: ${{ steps.payload.outputs.image_digest }}
      source-repository: ${{ steps.payload.outputs.source_repository }}
      source-commit: ${{ steps.payload.outputs.source_commit }}
    steps:
      - name: Validate payload types and required fields
        id: payload
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json
          import os

          payload = json.loads(os.environ["PAYLOAD"])
          required = {"application", "image", "image_tag", "image_digest", "source_repository", "source_commit"}
          if not isinstance(payload, dict) or not required.issubset(payload):
              raise SystemExit("Payload inválido: campos obrigatórios ausentes.")
          if set(payload) - required - {"environment"}:
              raise SystemExit("Payload contém campos desconhecidos.")
          # Apenas ausência permite o default; null, false, 0 e vazio são inválidos.
          payload.setdefault("environment", "dev")
          for value in payload.values():
              if not isinstance(value, str) or not value or len(value) > 255 or any(c in value for c in "\r\n"):
                  raise SystemExit("Todos os campos devem ser strings não vazias de até 255 caracteres, sem quebras de linha.")
          if payload["environment"] != "dev":
              raise SystemExit("Somente o ambiente dev é permitido.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for key, value in payload.items():
                  output.write(f"{key}={value}\n")
          PYTHON

  update-overlay:
    name: Update Image Overlay
    needs: validate-payload
    uses: ./.github/workflows/update-image-overlay-reusable.yml
    with:
      application: ${{ needs.validate-payload.outputs.application }}
      environment: ${{ needs.validate-payload.outputs.environment }}
      image: ${{ needs.validate-payload.outputs.image }}
      image-tag: ${{ needs.validate-payload.outputs.image-tag }}
      image-digest: ${{ needs.validate-payload.outputs.image-digest }}
      source-repository: ${{ needs.validate-payload.outputs.source-repository }}
      source-commit: ${{ needs.validate-payload.outputs.source-commit }}
    secrets:
      IMAGE_UPDATER_APP_ID: ${{ secrets.IMAGE_UPDATER_APP_ID }}
      IMAGE_UPDATER_APP_PRIVATE_KEY: ${{ secrets.IMAGE_UPDATER_APP_PRIVATE_KEY }}
      GHCR_READ_USERNAME: ${{ secrets.GHCR_READ_USERNAME }}
      GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
