apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: api-secrets
  namespace: apae
  annotations:
    sealedsecrets.bitnami.com/scope: strict
spec:
  encryptedData:
    SPRING_DATASOURCE_PASSWORD: AgA+ExampleEncryptedValueDatabasePasswordStringHereForGitOpsDeployment==
    JWT_SECRET: AgA+ExampleEncryptedValueJwtSecretStringHereForGitOpsDeployment==
  template:
    metadata:
      name: api-secrets
      namespace: apae
    type: Opaque

