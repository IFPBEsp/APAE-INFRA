apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apae-dev

resources:
  - ../../base

replicas:
  - name: apae
    count: 1
  - name: api
    count: 1
  - name: management-app
    count: 0

images:
  - name: ghcr.io/ifpbesp/apae-geral-frontend
    newTag: dev
  - name: ghcr.io/ifpbesp/apae-geral-backend
    newTag: dev
