apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apae-dev

resources:
  - ../../base
  - networkpolicy-api.yaml
  - networkpolicy-apae.yaml

replicas:
  - name: apae
    count: 0
  - name: api
    count: 0
  - name: management-app
    count: 0

images:
  - name: ghcr.io/ifpbesp/apae-geral-frontend
    newTag: dev
  - name: ghcr.io/ifpbesp/apae-geral-backend
    newTag: dev
