# Bootstrap: manter replicas zeradas ate a primeira promocao por digest
# e a configuracao de runtime/Secrets. Ver docs/workflows/releases-gitops.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apae-prod

resources:
  - ../../base

replicas:
  - name: apae
    count: 0
  - name: api
    count: 0
  - name: management-app
    count: 0

images:
  - name: ghcr.io/ifpbesp/apae-geral-frontend
    newTag: unpublished
  - name: ghcr.io/ifpbesp/apae-geral-backend
    newTag: unpublished
