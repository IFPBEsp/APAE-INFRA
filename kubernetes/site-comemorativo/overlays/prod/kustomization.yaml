# Bootstrap: manter replicas zeradas ate a primeira promocao por digest
# e a configuracao de runtime/Secrets. Ver docs/workflows/releases-gitops.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apae-prod

resources:
  - ../../base

replicas:
  - name: site-comemorativo
    count: 0

images:
  - name: ghcr.io/ifpbesp/apae-site-comemorativo
    newTag: unpublished
