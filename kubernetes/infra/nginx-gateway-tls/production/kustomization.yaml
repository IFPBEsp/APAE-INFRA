---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../staging
  - issuer.yaml
  - certificate.yaml
  - http-redirect.yaml
patches:
  - path: https-listener-patch.yaml
    target:
      group: gateway.networking.k8s.io
      version: v1
      kind: Gateway
      name: apae-gateway
      namespace: nginx-gateway
replacements:
  - source:
      kind: Certificate
      name: apae-staging-tls
      namespace: nginx-gateway
      fieldPath: spec.dnsNames.0
    targets:
      - select:
          kind: Certificate
          name: apae-public-tls
        fieldPaths:
          - spec.dnsNames.0
      - select:
          kind: Gateway
          name: apae-gateway
        fieldPaths:
          - spec.listeners.[name=https].hostname
      - select:
          kind: HTTPRoute
          name: apae-http-redirect
        fieldPaths:
          - spec.hostnames.0
