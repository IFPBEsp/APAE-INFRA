---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: apae-public-tls
  namespace: nginx-gateway
spec:
  secretName: apae-public-tls
  dnsNames:
    - hostname.invalid
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: letsencrypt-production
  privateKey:
    rotationPolicy: Always
