apiVersion: apps/v1
kind: Deployment
metadata:
  name: atendimento-app
  labels:
    app: atendimento-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atendimento-app
  template:
    metadata:
      labels:
        app: atendimento-app
    spec:
      containers:
        - name: atendimento-app
          image: ghcr.io/ifpbesp/ape-atendimento-frontend:dev
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          securityContext:
            runAsUser: 65532
            runAsGroup: 65532

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
