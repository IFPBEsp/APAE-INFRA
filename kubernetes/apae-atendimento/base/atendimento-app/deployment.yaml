apiVersion: apps/v1
kind: Deployment
metadata:
  name: atendimento-app
  labels:
    app: atendimento-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atendimento-app
  template:
    metadata:
      labels:
        app: atendimento-app
    spec:
      containers:
        - name: atendimento-app
          image: ghcr.io/ifpbesp/apae-atendimento-frontend:dev
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          volumeMounts:
            - name: next-cache
              mountPath: /app/.next/cache

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

      volumes:
        - name: next-cache
          emptyDir: { }
