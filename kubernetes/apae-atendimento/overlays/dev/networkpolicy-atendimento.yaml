apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: atendimento-allow-from-frontend
spec:
  podSelector:
    matchLabels:
      app: atendimento
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: atendimento-app
      ports:
        - protocol: TCP
          port: 8080
