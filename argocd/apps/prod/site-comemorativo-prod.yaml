apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: site-comemorativo-prod
  namespace: argocd
spec:
  project: apae

  source:
    repoURL: https://github.com/IFPBEsp/APAE-INFRA.git
    targetRevision: main
    path: kubernetes/site-comemorativo/overlays/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: apae-prod

  syncPolicy:
    syncOptions:
      - CreateNamespace=false
