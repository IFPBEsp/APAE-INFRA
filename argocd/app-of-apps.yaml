---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apae-root
  namespace: argocd
spec:
  project: apae-infra

  source:
    repoURL: https://github.com/IFPBEsp/APAE-INFRA.git
    targetRevision: main
    path: argocd

    directory:
      recurse: true
      include: 'apps/*/*.yaml'

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    syncOptions:
      - CreateNamespace=false
