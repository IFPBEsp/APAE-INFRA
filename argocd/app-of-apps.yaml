---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apae-root
  namespace: argocd
spec:
  project: apae-infra

  source:
    repoURL: https://github.com/IFPBEsp/APAE-INFRA.git
    targetRevision: main
    path: argocd

    directory:
      recurse: true
      exclude: '{app-of-apps.yaml,project.yaml,project-infra.yaml}'

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=false
