---
- name: Verificar readiness dos Deployments do ArgoCD
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - --kubeconfig
      - "{{ argocd_bootstrap_kubeconfig }}"
      - rollout
      - status
      - "deployment/{{ item }}"
      - -n
      - "{{ argocd_bootstrap_namespace }}"
      - --timeout=180s
  loop:
    - "{{ argocd_bootstrap_release_name }}-server"
    - "{{ argocd_bootstrap_release_name }}-repo-server"
    - "{{ argocd_bootstrap_release_name }}-redis"
  changed_when: false

- name: Verificar readiness do Application Controller
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - --kubeconfig
      - "{{ argocd_bootstrap_kubeconfig }}"
      - rollout
      - status
      - "statefulset/{{ argocd_bootstrap_release_name }}-application-controller"
      - -n
      - "{{ argocd_bootstrap_namespace }}"
      - --timeout=180s
  changed_when: false

- name: Verificar CRDs do ArgoCD
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - --kubeconfig
      - "{{ argocd_bootstrap_kubeconfig }}"
      - wait
      - --for=condition=Established
      - "crd/{{ item }}"
      - --timeout=120s
  loop:
    - applications.argoproj.io
    - appprojects.argoproj.io
    - applicationsets.argoproj.io
  changed_when: false

- name: Listar pods do ArgoCD
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - --kubeconfig
      - "{{ argocd_bootstrap_kubeconfig }}"
      - get
      - pods
      - -n
      - "{{ argocd_bootstrap_namespace }}"
      - -o
      - wide
  register: argocd_bootstrap_pods_result
  changed_when: false

- name: Exibir estado dos pods
  ansible.builtin.debug:
    msg: "{{ argocd_bootstrap_pods_result.stdout_lines }}"
