---
# Collections Ansible utilizadas pelos playbooks e roles.
# Cada collection DEVE ter versao exata fixada (ex.: "1.2.3"); o CI rejeita
# entradas sem versao ou com intervalos (>=, ~, *).
#
# Exemplo:
#   collections:
#     - name: ansible.posix
#       version: "x.y.z"
collections:
  - name: ansible.posix
    version: ">=1.0.0"
